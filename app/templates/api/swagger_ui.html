<!DOCTYPE html>
<html lang="en" data-bs-theme="light" data-ui-theme="light">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ title }}</title>
    <script>
        (function () {
            var THEMES = {
                light: 'light', dark: 'dark', 'dark-blue': 'dark', sepia: 'light', midnight: 'dark',
                vue: 'light', 'vue-dark': 'dark', nord: 'dark', dracula: 'dark',
                catppuccin: 'dark', 'one-dark': 'dark', 'solarized-light': 'light',
                'solarized-dark': 'dark', 'gruvbox-light': 'light', 'gruvbox-dark': 'dark',
                'tokyo-night': 'dark', 'rose-pine': 'dark', 'rose-pine-dawn': 'light',
                'everforest-dark': 'dark', 'everforest-light': 'light', kanagawa: 'dark',
                'kanagawa-lotus': 'light', ayu: 'dark', 'material-ocean': 'dark',
                'monokai-pro': 'dark', 'nordic-minimal': 'dark', 'slate-dark': 'dark',
                'cyberpunk-neon': 'dark', 'corporate-light': 'light', 'warm-beige': 'light',
                'forest-emerald': 'dark', 'high-contrast-pro': 'dark', 'oled-black': 'dark',
                'github-light': 'light', 'github-dark': 'dark', 'material-3': 'light'
            };
            var stored = localStorage.getItem('ui-theme');
            if (!stored || !THEMES[stored]) {
                stored = localStorage.getItem('dark-theme') === 'true' ? 'dark' : 'light';
            }
            var bsTheme = THEMES[stored];
            var root = document.documentElement;
            root.setAttribute('data-bs-theme', bsTheme);
            root.setAttribute('data-ui-theme', stored);
            root.classList.toggle('dark-mode', bsTheme === 'dark');
        })();
    </script>
    <link href="/static/assets/plugins/bootstrap/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/assets/fonts/fontawesome/css/fontawesome-all.min.css">
    <link rel="stylesheet" href="/static/assets/css/themes.css">
    {% include 'swagger-ui-css.html' %}
    <link rel="icon" href="/static/assets/images/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="/static/assets/css/swagger-brand.css">
</head>
<body data-tag="body">
    <script>
        (function () {
            var root = document.documentElement;
            var body = document.body;
            body.setAttribute('data-bs-theme', root.getAttribute('data-bs-theme') || 'light');
            body.setAttribute('data-ui-theme', root.getAttribute('data-ui-theme') || 'light');
            body.classList.toggle('dark-mode', root.classList.contains('dark-mode'));
        })();
    </script>
    <div class="fullscreen-controls" role="toolbar" aria-label="{{ _('Theme') }}">
        {% set theme_btn_class = '' %}
        {% set theme_label_class = 'ms-1' %}
        {% include 'includes/ui_theme_dropdown.html' %}
    </div>
    <header class="osys-swagger-header">
        <a class="osys-swagger-brand" href="/" title="osysHome">
            <img src="/static/assets/images/logo-dark.png" alt="osysHome" class="osys-swagger-logo osys-swagger-logo-light">
            <img src="/static/assets/images/logo.png" alt="osysHome" class="osys-swagger-logo osys-swagger-logo-dark">
            <span class="osys-swagger-title">osysHome API</span>
        </a>
        <nav class="osys-swagger-links">
            <a href="/">Home</a>
            <a href="/about">About</a>
            <a href="https://github.com/Anisan/osysHome" target="_blank" rel="noopener noreferrer">GitHub</a>
        </nav>
    </header>

    <svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" style="position:absolute;width:0;height:0">
      <defs>
        <symbol viewBox="0 0 20 20" id="unlocked">
              <path d="M15.8 8H14V5.6C14 2.703 12.665 1 10 1 7.334 1 6 2.703 6 5.6V6h2v-.801C8 3.754 8.797 3 10 3c1.203 0 2 .754 2 2.199V8H4c-.553 0-1 .646-1 1.199V17c0 .549.428 1.139.951 1.307l1.197.387C5.672 18.861 6.55 19 7.1 19h5.8c.549 0 1.428-.139 1.951-.307l1.196-.387c.524-.167.953-.757.953-1.306V9.199C17 8.646 16.352 8 15.8 8z"></path>
        </symbol>
        <symbol viewBox="0 0 20 20" id="locked">
          <path d="M15.8 8H14V5.6C14 2.703 12.665 1 10 1 7.334 1 6 2.703 6 5.6V8H4c-.553 0-1 .646-1 1.199V17c0 .549.428 1.139.951 1.307l1.197.387C5.672 18.861 6.55 19 7.1 19h5.8c.549 0 1.428-.139 1.951-.307l1.196-.387c.524-.167.953-.757.953-1.306V9.199C17 8.646 16.352 8 15.8 8zM12 8H8V5.199C8 3.754 8.797 3 10 3c1.203 0 2 .754 2 2.199V8z"/>
        </symbol>
        <symbol viewBox="0 0 20 20" id="close">
          <path d="M14.348 14.849c-.469.469-1.229.469-1.697 0L10 11.819l-2.651 3.029c-.469.469-1.229.469-1.697 0-.469-.469-.469-1.229 0-1.697l2.758-3.15-2.759-3.152c-.469-.469-.469-1.228 0-1.697.469-.469 1.228-.469 1.697 0L10 8.183l2.651-3.031c.469-.469 1.228-.469 1.697 0 .469.469.469 1.229 0 1.697l-2.758 3.152 2.758 3.15c.469.469.469 1.229 0 1.698z"/>
        </symbol>
        <symbol viewBox="0 0 20 20" id="large-arrow">
          <path d="M13.25 10L6.109 2.58c-.268-.27-.268-.707 0-.979.268-.27.701-.27.969 0l7.83 7.908c.268.271.268.709 0 .979l-7.83 7.908c-.268.271-.701.27-.969 0-.268-.269-.268-.707 0-.979L13.25 10z"/>
        </symbol>
        <symbol viewBox="0 0 20 20" id="large-arrow-down">
          <path d="M17.418 6.109c.272-.268.709-.268.979 0s.271.701 0 .969l-7.908 7.83c-.27.268-.707.268-.979 0l-7.908-7.83c-.27-.268-.27-.701 0-.969.271-.268.709-.268.979 0L10 13.25l7.418-7.141z"/>
        </symbol>
        <symbol viewBox="0 0 24 24" id="jump-to">
          <path d="M19 7v4H5.83l3.58-3.59L8 6l-6 6 6 6 1.41-1.41L5.83 13H21V7z"/>
        </symbol>
        <symbol viewBox="0 0 24 24" id="expand">
          <path d="M10 18h4v-2h-4v2zM3 6v2h18V6H3zm3 7h12v-2H6v2z"/>
        </symbol>
      </defs>
    </svg>

    <div id="swagger-ui"></div>

    <script src="/static/assets/plugins/bootstrap/js/bootstrap.bundle.min.js"></script>
    <script src="/static/assets/js/theme-manager.js"></script>
    {% include 'swagger-ui-libs.html' %}
    <script type="text/javascript">
        window.onload = function() {
            const ui = window.ui = new SwaggerUIBundle({
                url: "{{ specs_url }}",
                {% if config.SWAGGER_UI_OAUTH_CLIENT_ID -%}
                oauth2RedirectUrl: "{{ url_for('restx_doc.static', filename='oauth2-redirect.html', _external=True) }}",
                {%- endif %}
                validatorUrl: "{{ config.SWAGGER_VALIDATOR_URL }}" || null,
                dom_id: "#swagger-ui",
                presets: [
                    SwaggerUIBundle.presets.apis,
                    SwaggerUIStandalonePreset.slice(1)
                ],
                plugins: [
                    SwaggerUIBundle.plugins.DownloadUrl
                ],
                {% if config.SWAGGER_SUPPORTED_SUBMIT_METHODS is defined -%}
                  supportedSubmitMethods: {{ config.SWAGGER_SUPPORTED_SUBMIT_METHODS | tojson}},
                {%- endif %}
                displayOperationId: {{ config.SWAGGER_UI_OPERATION_ID|default(False)|tojson }},
                displayRequestDuration: {{ config.SWAGGER_UI_REQUEST_DURATION|default(False)|tojson }},
                docExpansion: "{{ config.SWAGGER_UI_DOC_EXPANSION | default('none') }}"
            })

            {% if config.SWAGGER_UI_OAUTH_CLIENT_ID -%}
            ui.initOAuth({
                clientId: "{{ config.SWAGGER_UI_OAUTH_CLIENT_ID }}",
                realm: "{{ config.SWAGGER_UI_OAUTH_REALM }}",
                appName: "{{ config.SWAGGER_UI_OAUTH_APP_NAME }}"
            })
            {%- endif %}
        }
    </script>
</body>
</html>
