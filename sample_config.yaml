# Working osysHome configuration
# Copy this file to config.yaml and adjust settings before production use.
#
# SECURITY CHECKLIST (required before exposing the instance to a network / internet):
#   1. secret_key       — MUST be a unique random string (never leave the sample value).
#   2. debug            — MUST be false in production.
#   3. session_cookie_secure — SHOULD be true when HTTPS / reverse proxy with TLS is used.
#   4. Admin password   — set a strong password on first login (first visit creates admin).
#   5. Network          — do not port-forward to the internet without TLS and a strong secret_key.
#   6. Guest accounts   — role "user" is trusted; only create if you understand API access.
#   7. HTTPS deploy     — see deploy/README.md (nginx + systemd + Let's Encrypt).
#
# SQL API (/api/sql/*) is admin-only by default. Other roles can be allowed per-endpoint
# in the Permissions plugin (_permissions.api:select_query etc.).
#
# AUTO-CONFIG: On first start, if secret_key is still the sample value below, osysHome
# generates a random secret_key, applies recommended security settings, and updates
# config.yaml in place (your comments in this file are preserved). After you set
# secret_key manually, auto-config never runs again.
#
# Form editor (XRAY → Config): lines starting with "choices:" list allowed values
# for dropdowns and are not shown as help text.

# Core application / Flask runtime settings.
application:
  # Default UI language.
  # Examples: 'en', 'ru', 'de'.
  # choices: en, ru, de, es, fr, it, ja, ko, pl, pt, uk, zh
  default_language: 'en'

  # Default timezone for displaying dates and times.
  # Use an IANA timezone name such as 'Europe/Moscow'.
  default_timezone: 'Europe/Moscow'

  # Flask secret key used for sessions and CSRF tokens.
  # REQUIRED: generate a unique value before any real deployment, e.g.:
  #   python -c "import secrets; print(secrets.token_hex(32))"
  # Leaving the sample value allows session forgery.
  secret_key: 'your-secret-key-here'  # CHANGE ME — mandatory

  # Global application debug mode.
  # REQUIRED: false in production (exposes internals, disables safe defaults).
  debug: false

  # HTTP port used by the application.
  app_port: 5000

  # Application environment name.
  # Common values are 'production' and 'development'.
  # choices: production, development
  env: 'production'

  # Base size of the internal worker thread pool.
  # Affects concurrent background task processing.
  pool_size: 20

  # Maximum size of the worker thread pool.
  # If null, the application uses its internal default behavior.
  pool_max_size: 100

  # Threshold in seconds after which a pool task is considered slow.
  pool_timeout_threshold: 60.0

  # Forced flush interval for batched writes, in seconds.
  # Lower values write data sooner but increase write frequency.
  # On Raspberry Pi + microSD prefer 2.0–5.0 (see docs/DISK_WRITE_OPTIMIZATION.ru.md).
  batch_writer_flush_interval: 0.5

  # Flush when the in-memory batch reaches this size (0 = timer only).
  batch_writer_max_size: 0

  # Max depth of reactive property→method chains (guards against infinite loops).
  reactive_max_depth: 20

  # Notify admin when a reactive loop is detected.
  reactive_loop_notify: true

  # Background preload of all objects after startup (lazy onInit without blocking boot).
  object_preload_enabled: true

  # How many objects to preload per batch tick.
  object_preload_batch_size: 10

  # Pause in seconds between object preload batches.
  object_preload_interval_sec: 0.5

  # In-memory history for property value changes (Objects UI «Memory history»).
  # Not the DB History table — RAM only, cleared on object reload / process restart.
  # Window in seconds; entries older than this are pruned.
  memory_history_window_sec: 3600

  # Hard cap on history entries kept per property (newest kept).
  memory_history_max_entries: 100

  # In-memory history window for method calls (same UI, method buttons), in seconds.
  memory_method_calls_window_sec: 3600

  # Hard cap on method-call history entries kept per method (newest kept).
  memory_method_calls_max_entries: 100

  # User session lifetime in days.
  # Default is 31 days, matching Flask's default behavior.
  session_lifetime_days: 31

  # Timeout for outbound HTTP requests in seconds.
  # Used as the default timeout for requests.get/post and similar calls.
  http_request_timeout: 15

  # Require HTTPS for the session cookie (Set-Cookie Secure flag).
  # REQUIRED when the UI is served over HTTPS (reverse proxy, TLS termination).
  # Can stay false only for pure HTTP on a trusted local network.
  session_cookie_secure: false  # set true behind HTTPS

  # SameSite policy for the session cookie.
  # 'Lax' is a good default for most deployments.
  # choices: Lax, Strict, None
  session_cookie_samesite: 'Lax'

  # Rate limiting to protect against brute-force attempts and overload.
  rate_limit:
    # Enable or disable rate limiting globally.
    enabled: true

    # Default rate limit for all routes (Flask-Limiter style string).
    default: '100 per minute'

    # Dedicated rate limit for the login page.
    login: '5 per minute'

    # Rate limit for API routes.
    # Used when no more specific API limit is configured elsewhere.
    api: '100 per minute'

# File / console logging (see docs/DISK_WRITE_OPTIMIZATION.ru.md for Pi profiles).
logging:
  # Minimum log level when application.debug is false.
  # When debug is true, the effective default is DEBUG.
  # choices: DEBUG, INFO, WARNING, ERROR, CRITICAL
  min_level: INFO

  # Write rotating log files under directory.
  # false = console/journal only (less SD wear on Raspberry Pi).
  file_enabled: true

  # Also emit log records to the process console / stdout.
  console_enabled: true

  # Log directory: relative to project root, or absolute (e.g. a tmpfs mount).
  directory: logs

  # true: one file per module (moduleName.log). false: single app.log + errors.log.
  per_module_files: true

  # Buffer N records in RAM before flushing to disk (0 = immediate).
  # Always flushes immediately on ERROR and above.
  memory_handler_capacity: 0

  # TimedRotatingFileHandler backup count (days kept for midnight rotation).
  backup_count: 7

  # In-app notify when ERROR+ rate is elevated (in-memory counter; no extra log I/O).
  # Errors are grouped by logger + normalized message: one unread series does not
  # block notifies for a different error text / module.
  error_rate:
    # Enable or disable ERROR rate monitoring / notify.
    enabled: true

    # Sliding window length in seconds for counting ERROR+ of the same fingerprint.
    # 5 minutes covers slow reconnect loops and multi-cycle API polls.
    window_sec: 300

    # Notify when this many matching ERROR+ records occur within window_sec.
    # ~1/min sustained drip of the same error; ignores one-off blips.
    threshold: 5

    # While that fingerprint's notify is unread: min seconds between count bumps.
    # Other fingerprints are unaffected. After the user marks it read, a new
    # notify can fire when the threshold is reached again.
    cooldown_sec: 600

# Database connection and SQLite PRAGMA tuning.
database:
  # Print SQL statements to the log.
  # Useful for SQL debugging, but noisy and slower in production.
  sqlalchemy_echo: false

  # SQLAlchemy connection pool size.
  # Most relevant for PostgreSQL and MySQL/MariaDB.
  pool_size: 20

  # SQLite database filename.
  # Used when connection_string is null, empty, or omitted.
  # On Pi prefer USB/SSD path via absolute path in connection_string if possible.
  db_name: 'app.db'

  # External database connection string.
  # null / empty / omitted → SQLite with db_name above.
  # PostgreSQL example:
  #   'postgresql+psycopg2://osyshome:password@localhost/osyshome'
  # MySQL example:
  #   'mysql://osyshome:password@localhost/app'
  # Server-side tips (not applied by osysHome): keep PG/MySQL data dir off microSD;
  # PostgreSQL: synchronous_commit=off (risk on power loss); MariaDB/MySQL:
  # innodb_flush_log_at_trx_commit=2, sync_binlog=0.
  connection_string: null

  # SQLite PRAGMA applied on each connection (ignored for other engines).
  sqlite:
    # SQLite journal mode (WAL is usually best for concurrent reads).
    # choices: DELETE, TRUNCATE, PERSIST, MEMORY, WAL, OFF
    journal_mode: WAL

    # How aggressively SQLite syncs to disk.
    # FULL (safest) | NORMAL (good for Pi) | OFF (min writes, risk on power loss).
    # Omit or null to leave SQLite default after journal_mode.
    # choices: null, FULL, NORMAL, OFF, EXTRA
    synchronous: null

    # Where SQLite keeps temporary tables and indices.
    # choices: null, DEFAULT, FILE, MEMORY
    temp_store: null

    # Page cache size hint for SQLite (PRAGMA cache_size).
    # Negative values are KiB (e.g. -65536 ≈ 64 MiB). null = do not set.
    cache_size: null

    # Memory-map I/O size in bytes (PRAGMA mmap_size). null = do not set.
    mmap_size: null

    # WAL autocheckpoint interval in pages (PRAGMA wal_autocheckpoint).
    # null = do not set (SQLite default).
    wal_autocheckpoint: null

# Extra debugging tools (Flask Debug Toolbar and related).
# Usually kept disabled even when application.debug is true.
debug_tools:
  # Master switch for heavy debugging tools / Debug Toolbar integration.
  enabled: false

  # Enable the template editor inside Flask Debug Toolbar.
  # Rarely needed in normal development.
  template_editor_enabled: false

  # Enable request profiling in Debug Toolbar.
  # This can noticeably slow page rendering.
  profiler_enabled: false

  # Output filename used by the profiler when profiling is enabled.
  profiler_dump_filename: 'dump.prof'

  # Intercept HTTP redirects in Debug Toolbar instead of following them normally.
  intercept_redirects: false

  # Collect SQL query statistics for each HTTP request.
  # Useful for investigating slow pages, but adds overhead.
  sqlalchemy_record_queries: false

# Application cache backend (Flask-Caching style).
cache:
  # Path to the cache directory.
  # Used by file-based cache backends (e.g. filesystem).
  file_path: 'cache'

  # Cache backend type.
  # 'simple' stores data in process memory — prefer on Raspberry Pi (avoid filesystem cache on SD).
  # choices: simple, filesystem, redis, memcached, null
  type: 'simple'

  # Cache entry lifetime (TTL) in seconds.
  timeout: 300

# Service / process management hints used by restart helpers.
service:
  # Allow automatic restart handling through built-in restart actions.
  autorestart: False

  # systemd service name for service management.
  # Leave null if systemd is not used.
  name: null

  # Docker container name for restart management through Docker.
  # Leave null if the application is not running in a container.
  docker_container: null
