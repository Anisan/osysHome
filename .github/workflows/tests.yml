name: Tests

on:
  push:
    branches:
      - master
      - main
  pull_request:
  workflow_dispatch:

jobs:
  core-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest

      - name: Prepare test config
        run: cp sample_config.yaml config.yaml

      - name: Run core tests
        run: |
          python -m pytest tests/core tests/contracts \
            tests/integration/test_property_binding_chain.py \
            tests/integration/test_core_diagnostics_offline.py -q

  perf-tests:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest

      - name: Prepare test config
        run: cp sample_config.yaml config.yaml

      - name: Run performance tests
        env:
          PERF_TESTS: "1"
        run: python -m pytest tests/perf -q
